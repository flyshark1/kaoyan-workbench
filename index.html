.ov-lead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}

.ai-note{background:linear-gradient(135deg,#e8f6ef,#f2fbf7);border-left:3px solid var(--green);border-radius:0 12px 12px 0;padding:13px 16px;font-size:.95rem;line-height:1.65;color:#14513f;font-weight:600}

.kt-scroll{max-height:340px;overflow-y:auto;margin-top:10px;padding-right:4px}
/* ===== 日程独立页 · 日历（2026-09-15 v2） ===== */
.cal-head{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.cal-title{font-size:1.05rem;font-weight:700;color:var(--ink);min-width:140px;text-align:center;letter-spacing:.04em}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);padding:2px 0 6px}
.cal-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-height:62px;padding:6px 3px;border:1px solid var(--line);border-radius:9px;background:#fff;
  cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,transform .15s;overflow:hidden}
.cal-cell:hover{background:#f0f9ff;border-color:var(--accent)}
.cal-cell.off{background:#f6fafd;border-color:#e6f0f8;cursor:default}
.cal-cell.off:hover{background:#f6fafd;border-color:#e6f0f8}
.cal-cell.today{border-color:var(--gold);border-width:2px}
.cal-cell.on{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.cal-cell.on .cc-d,.cal-cell.on .cc-n,.cal-cell.on .cc-t{color:#fff}
.cal-cell .cc-d{font-size:.86rem;font-weight:700;color:var(--ink);line-height:1.1}
.cal-cell .cc-n{font-size:.62rem;font-weight:600;color:var(--green)}
.cal-cell .cc-t{font-size:.58rem;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;line-height:1.15}
.ag-dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
  padding-top:14px;border-top:1px solid var(--line)}

  .ag-dayhead .btn{margin-left:auto}
}
}

.pomo-hero .hquote{font-family:Georgia,serif;font-style:italic;font-size:1.05rem;color:#ffe9c2;max-width:520px;line-height:1.7;border-left:3px solid rgba(255,255,255,.45);padding:6px 0 6px 14px;text-shadow:0 1px 4px rgba(0,0,0,.35)}

function normalizeSub(v){
  v=String(v==null?"":v).trim();
  if(!v||v==="—"||v==="-") return "—";
  if(v.indexOf("数学")>-1) return "数学";
  if(v.indexOf("408")>-1||v.indexOf("专业课")>-1||v.indexOf("计")>-1) return "408";
  if(v.indexOf("英语")>-1||v.indexOf("单词")>-1) return "英语";
  if(v.indexOf("政治")>-1) return "政治";
  if(v.indexOf("查漏")>-1||v.indexOf("补缺")>-1) return "查漏补缺";
  return "—";
}
function pillClassFor(sub){
  sub=String(sub==null?"":sub).trim();
  if(!sub||sub==="—"||sub==="-") return "pill-dash";
  if(sub.indexOf("数学")>-1) return "pill-math";
  if(sub.indexOf("408")>-1||sub.indexOf("专业课")>-1||sub.indexOf("计")>-1) return "pill-408";
  if(sub.indexOf("英语")>-1||sub.indexOf("单词")>-1) return "pill-eng";
  if(sub.indexOf("政治")>-1) return "pill-pol";
  return "pill-misc";
}
function schedItemsHtml(items){

      return '<li class="subitem"><div class="row"><span class="it">'+esc(it.sub.it)+'</span><span class="txt">'+esc(it.sub.txt)+'</span></div></li>';
    }
    var inner='<span class="txt"';
    if(it.muted) inner+=' muted';
    inner+='>'+esc(it.txt);
    if(it.star) inner+='<span class="star">'+esc(it.star)+'</span>';
    inner+='</span>';
    if(it.em) inner+='<span class="em">'+esc(it.em)+'</span>';
    var row='<div class="row">';
    if(it.it) row+='<span class="it">'+esc(it.it)+'</span>';

  }).join("");
}

function load(){
 try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var d=JSON.parse(raw); if(d&&d.settings){ state=d; migrate(); invalidateStaleSnapshots(); return; } } }catch(e){}
 state=defaultState(); invalidateStaleSnapshots(); save();
}
function migrate(){
  if(!state.customSubjects) state.customSubjects=[];
  if(!state.edits) state.edits={};
  if(!state.reviews||typeof state.reviews!=="object"||Array.isArray(state.reviews)) state.reviews={};
  /* 任务补 date 字段（老数据只有分组日期，没有任务级 date） */
  if(state.tasks&&typeof state.tasks==="object"){
    Object.keys(state.tasks).forEach(function(k){
      if(Array.isArray(state.tasks[k])) state.tasks[k].forEach(function(t){ if(t&&!t.date) t.date=k; });
    });
  }
  if(!Array.isArray(state.schedRows)){
    state.schedRows=SCHED_TABLE.map(function(r,i){ return {time:r.time,sub:r.sub,note:"",del:false,src:i}; });
  } else {
    state.schedRows.forEach(function(r,i){ if(r&&r.src==null) r.src=i; });
  }
  if(!state.monthTask) state.monthTask={};
  if(!state.monthDone) state.monthDone={};
  if(!Array.isArray(state.pomoTasks)) state.pomoTasks=POMO_DEFAULT_SUBJ.map(function(x){return {id:x.id,name:x.name,minutes:x.minutes,bg:x.bg,tag:x.tag,icon:x.icon,custom:false};});
  if(!Array.isArray(state.pomoSessions)) state.pomoSessions=[];
  /* id 重复兜底：若遇历史脏数据，按位置补一个新 id */
  var seenP={};
  state.pomoTasks.forEach(function(t,i){ if(!t.id||seenP[t.id]) t.id="pomo_"+i+"_"+Math.floor(Math.random()*9999); seenP[t.id]=1; });
  var mkey;
  for(mkey in state.monthTask){
    var t=state.monthTask[mkey];
    for(var k in t){
      if(t[k]){ if(!state.monthDone[k]) state.monthDone[k]=[]; state.monthDone[k][Number(mkey)-1]=true; }
    }
  }
}
function invalidateStaleSnapshots(){
  var changed=false;
  /* 一次性迁移 v2：月度计划由「两套」合并为「一套 16 个月（2026年9月起）」，*/
  /* 旧的月度计划编辑记录索引已失效（12/10 项 → 16 项），只清一次        */
  if(state.planMigrated!=="v2"){
    if(state.edits&&typeof state.edits==="object"){
      Object.keys(state.edits).forEach(function(k){ if(k.indexOf("mp.")===0||k.indexOf("mpc.")===0) delete state.edits[k]; });
    }
    state.planMigrated="v2"; changed=true;
  }
  if(state.contentVer!==BK_CONTENT_VER){
    var keys=[];
    if(state.edits&&typeof state.edits==="object"){
      Object.keys(state.edits).forEach(function(k){ if(k.indexOf("bkhtml.")===0) keys.push(k); });
      if(keys.length){
        var bak={}; keys.forEach(function(k){ bak[k]=state.edits[k]; delete state.edits[k]; });
        try{ localStorage.setItem("workbench_edits_bak", JSON.stringify(bak)); }catch(e){}
        state._snapCleared=keys.length;
      }
    }
    state.contentVer=BK_CONTENT_VER; changed=true;
  }
  if(changed){ try{ save(); }catch(e){} }
}

/* ===== 任务的时间/日期支持（任务级目标时间 + 跨天安排） ===== */
/* 任务字段：{id, subject, text, done, prio, time, date}
   - time: 目标时间，格式 "07:30" 或 "07:30~08:30"（可空）
   - date: 归属日期 "YYYY-MM-DD"；缺省视为所属分组的日期（老数据兼容） */
function taskDate(k,t){ return (t&&t.date)?t.date:k; }
/* 解析任务的目标时间 → {start,end}（分钟）；无时间返回 null */
function taskTimeRange(t){
  if(!t||!t.time) return null;
  var parts=String(t.time).split(/[~～\-—到]/);
  var st=hhmm2min(parts[0]);
  if(st==null) return null;
  var en=parts.length>1?hhmm2min(parts[1]):null;
  if(en==null) en=st+60;                 /* 只填开始时间，默认 1 小时 */
  if(en<=st) en+=1440;                   /* 跨天 */
  return {start:st,end:en};
}
/* 把某天的任务补上 date 字段（原地） */
function ensureTaskDates(k){
  var l=state.tasks[k]; if(!l) return;
  l.forEach(function(t){ if(t&&!t.date) t.date=k; });
}
/* 全量任务展开为 [{date,task,range}]，按日期+时间排序 */
function allTaskEntries(){
  var out=[];
  Object.keys(state.tasks||{}).forEach(function(k){
    ensureTaskDates(k);
    (state.tasks[k]||[]).forEach(function(t){
      out.push({date:taskDate(k,t), key:k, task:t, range:taskTimeRange(t)});
    });
  });
  out.sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    var ar=a.range, br=b.range;
    if(ar&&br){ if(ar.start!==br.start) return ar.start-br.start; }
    else if(ar) return -1;                /* 有时间排前面 */
    else if(br) return 1;
    return 0;
  });
  return out;
}

var PRIO_RANK={high:0,mid:1,low:2};
function prioKey(p){ return p==="高"?"high":(p==="中"?"mid":"low"); }
function prioLabel(p){ return p==="高"?"高":(p==="中"?"中":"低"); }
/* 今日任务（主页「今日重点」用）：未完成优先，再按「目标时间」、优先级排序；
   返回全部任务——与「学习任务」页保持完全一致，不做截断 */
function keyTasks(){
  var tl=todayTasks().slice();
  tl.forEach(function(t){ ensureTaskDates(todayStr()); });
  tl.sort(function(a,b){
    if(!!a.done!==!!b.done) return a.done?1:-1;
    var ar=taskTimeRange(a), br=taskTimeRange(b);
    if(ar&&br&&ar.start!==br.start) return ar.start-br.start;
    if(ar&&!br) return -1;
    if(!ar&&br) return 1;
    var d=PRIO_RANK[prioKey(a.prio)]-PRIO_RANK[prioKey(b.prio)];
    if(d) return d;
    return 0;
  });
  return tl;
}
/* 把 "07:30" / "7:30" 转成当天分钟数，非法返回 null */
function hhmm2min(s){
  if(!s) return null;
  var m=String(s).match(/(\d{1,2})\s*[:：]\s*(\d{1,2})/);
  if(!m) return null;
  var h=Number(m[1]), mi=Number(m[2]);
  if(isNaN(h)||isNaN(mi)||h>23||mi>59) return null;
  return h*60+mi;
}
/* 从 schedRows 解析出 {start,end,sub,note} 列表；结束早于开始视为跨天 */
function timelineItems(){
  var rows=(state.schedRows||[]).filter(function(r){ return r&&!r.del; });
  var out=[];
  rows.forEach(function(r,i){
    var base=(r&&r.src!=null&&SCHED_TABLE[r.src])?SCHED_TABLE[r.src]:null;
    var timeVal=(r&&r.time!=null&&r.time!=="")?r.time:(base?base.time:"");
    if(!timeVal) return;
    var parts=String(timeVal).split(/[~～\-—到]/);
    var st=hhmm2min(parts[0]);
    var en=parts.length>1?hhmm2min(parts[1]):null;
    if(st==null) return;
    if(en==null) en=st+60;
    if(en<=st) en+=1440;                 // 跨天
    var subVal=(r&&r.sub!=null&&r.sub!=="")?r.sub:(base?base.sub:"");
    if(subVal==="—") subVal="";
    var noteVal=(r&&r.note)?r.note:(base?base.act:"");
    out.push({i:i, start:st, end:en, raw:timeVal, sub:subVal, note:noteVal});
  });
  out.sort(function(a,b){ return a.start-b.start; });
  return out;
}
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function fmtDur(min){
  if(min>=60){ var h=Math.floor(min/60), m=min%60; return m? h+" 小时 "+m+" 分" : h+" 小时"; }
  return min+" 分钟";
}
/* 找当前进行项与下一项 */
function currentAndNext(){
  var items=timelineItems(), n=nowMin();
  var now=null, next=null;
  // 1) 常规区间（start < end，同日）
  for(var i=0;i<items.length;i++){
    if(n>=items[i].start && n<items[i].end){ now=items[i]; break; }
  }
  // 2) 跨天区间：st>1440 表示从昨晚延续到今晨，用 n+1440 比对
  if(!now){
    for(var k=0;k<items.length;k++){
      var it=items[k];
      if(it.end>1440 && (n+1440)>=it.start && (n+1440)<it.end){ now=it; break; }
    }
  }
  // 3) 下一项
  if(!now){
    for(var j=0;j<items.length;j++){
      if(items[j].start>n && items[j].end<=1440){ next=items[j]; break; }
    }
  } else if(now.end>1440){
    // 跨天时段生效 ⇒ 已进入次日，下一项取时间轴上游最早的同日时段
    for(var q=0;q<items.length;q++){
      if(items[q].i===now.i) continue;
      if(items[q].end<=1440){ next=items[q]; break; }
    }
  } else {
    for(var m=0;m<items.length;m++){
      if(items[m].i===now.i) continue;
      if(items[m].start>now.start && items[m].end<=1440){ next=items[m]; break; }
    }
  }
  return {now:now, next:next, items:items};
}

function aiAdvice(){

  var undone=tl.filter(function(x){ return !x.done; });
  var done=tl.length-undone.length;
  var cn=currentAndNext();

  if(!tl.length){
    t.push("今天还没有添加任务，建议先列出 2~3 件最重要的事。");
  } else if(!undone.length){
    t.push("今日 "+tl.length+" 项任务已全部完成，可以安排一轮错题复盘。");
  } else {
    var first=undone[0];
    t.push("上午优先推进「"+first.text+"」"+aiPrioTail(first.prio));
  }

  // 当前时段
  if(cn.now){
    if(cn.now.sub) t.push("现在正处于「"+cn.now.sub+"」时段（"+cn.now.raw+"），保持专注。");
    else t.push("当前时段（"+cn.now.raw+"）安排为"+(cn.now.note||"自由安排")+"。");
  } else if(cn.next){
    var gap=cn.next.start-nowMin();
    if(gap>0&&gap<180) t.push("距离下一项「"+(cn.next.sub||cn.next.note||"安排")+"」还有 "+fmtDur(gap)+"，可先做点轻量任务。");
  } else if(cn.items.length){
    t.push("今日日程时段已过完，建议进入复盘并列出明日计划。");
  }

  // 进度与阶段
  if(tl.length){
    var pct=Math.round(done/tl.length*100);
    if(pct>=100) t.push("完成度 100%，节奏很好，记得给明天留出缓冲。");
    else if(pct>=50) t.push("今日完成 "+done+"/"+tl.length+"（"+pct+"%），保持这个节奏。");
    else t.push("当前完成 "+done+"/"+tl.length+"，建议先啃掉一件高优先级任务。");
  }
  t.push("当前处于「"+ph.name+"」（"+ph.range+"），"+PHASE_HINT[ph.name]);

  // 连续打卡
  var sk=streak();

  return t.slice(0,3).join(" ");
}

var RV_SUBJECT_WORDS=["408","数学","英语","政治","数据结构","计组","操作系统","计网","高数","线代","概率"];
function guessSubject(line){
  for(var i=0;i<RV_SUBJECT_WORDS.length;i++){
    if(line.indexOf(RV_SUBJECT_WORDS[i])===0) return RV_SUBJECT_WORDS[i];
  }
  for(var j=0;j<RV_SUBJECT_WORDS.length;j++){
    if(line.indexOf(RV_SUBJECT_WORDS[j])>=0) return RV_SUBJECT_WORDS[j];
  }
  return "其他";
}

function reviewToTasks(){
  var pa=$("rvPlan");
  var raw=pa?pa.value:"";
  var lines=raw.split(/\r?\n/).map(trimStr).filter(function(x){return x;});
  if(!lines.length){ alert("「明日计划」还是空的。先写几行，每行一件事。"); return; }
  var k=tomorrowStr();
  if(!state.tasks[k]) state.tasks[k]=[];
  var added=0;
  lines.forEach(function(line){
    /* 去掉行首的序号 / - / * / 1. 等标记 */
    var text=line.replace(/^\s*(?:[-*·•]|\d+[.、)])\s*/,"");
    var subject=guessSubject(text);
    /* 已经写过同一句就不重复添加 */
    var dup=state.tasks[k].some(function(t){ return t.subject===subject && trimStr(t.text)===trimStr(text); });
    if(dup) return;
    state.tasks[k].push({id:"t"+Date.now()+Math.floor(Math.random()*9999)+added,subject:subject,text:text,done:false,prio:"中"});
    added++;
  });
  var r=rvTodayEntry(); r._toTasks=k;
  save();
  var tip=$("rvSaveTip");
  if(tip) tip.textContent="📥 已添加 "+added+" 条到 "+k+" 的任务列表"+((lines.length-added)>0?"（跳过 "+(lines.length-added)+" 条重复）":"");
  if(added>0){
    var btn=document.querySelector('[data-action="review-to-tasks"]');
    if(btn){ var b=btn.getBoundingClientRect(); burst(b.left+b.width/2,b.top+b.height/2,22); }

/* 今日任务里「当前该做的」与「下一项」：按任务目标时间判定 */
function taskCurrentNext(){
  var tl=todayTasks(), n=nowMin();
  var timed=[], untimed=[];
  tl.forEach(function(t){
    var r=taskTimeRange(t);
    if(r) timed.push({t:t, r:r}); else untimed.push(t);
  });
  timed.sort(function(a,b){ return a.r.start-b.r.start; });
  var now=null, next=null;
  /* 1) 当前：时间区间覆盖此刻、且未完成 */
  for(var i=0;i<timed.length;i++){
    var e=timed[i];
    if(!e.t.done && n>=e.r.start && n<e.r.end){ now=e; break; }
  }
  /* 2) 没有正当时的：取「还没到时间」里最早的一条；
        都过期了则取最近一条未完成的（提醒补做） */
  if(!now){
    for(var a=0;a<timed.length;a++){
      if(!timed[a].t.done && timed[a].r.start>n){ next=timed[a]; break; }
    }
  } else {
    for(var b=0;b<timed.length;b++){
      if(timed[b]===now) continue;
      if(!timed[b].t.done && timed[b].r.start>=now.r.end){ next=timed[b]; break; }
    }
  }
  /* 3) 完全没排时间的任务：作为兜底「现在该做」 */
  var fallback=null;
  if(!now){
    var undone=untimed.filter(function(t){ return !t.done; });
    if(undone.length) fallback=undone[0];
  }
  return {now:now, next:next, fallback:fallback, timed:timed, untimed:untimed,
          doneN:tl.filter(function(t){return t.done}).length, total:tl.length};
  }

  } else if(cn.fallback){

  }).slice(0,4);

    });

  }
  h+='</div>';
  return h;
}

/* "YYYY-MM-DD" → 分钟数（本地时区，供日期距离比较） */
function ymd2min(ds){
  var p=String(ds).split("-");
  return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])).getTime()/60000;
}
/* Date → "YYYY-MM-DD" */
function ymdOf(d){
  var m=d.getMonth()+1, dd=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
}
/* Date → "YYYY-MM" */
function ymOf(d){
  var m=d.getMonth()+1;
  return d.getFullYear()+"-"+(m<10?"0":"")+m;
}

/* 当日任务排序：未完成在前 → 有时间按开始时间升序 → 无时间保持原序 */
function agendaDayTasks(date){
  var list=(state.tasks||{})[date];
  if(!Array.isArray(list)) return [];
  list.forEach(function(t){ if(!t.date) t.date=date; });
  return list.slice().sort(function(a,b){
    if(!!a.done!==!!b.done) return a.done?1:-1;
    var ar=taskTimeRange(a), br=taskTimeRange(b);
    if(ar&&br&&ar.start!==br.start) return ar.start-br.start;
    if(ar&&!br) return -1;
    if(!ar&&br) return 1;
    return 0;
  });
}

/* 选中日期：显式选择 > 今天 */
function agendaAnchor(){
  return agendaDate || todayStr();
}
/* 展示月份：显式切月 > 选中日期所在月 */
function agendaMonthKey(){
  var a=agendaAnchor();
  return agendaMonth || a.slice(0,7);
}

/* 月历网格：周一为第一列，共 6 行 × 7 列 = 42 格。
   只显示当月，月初/月末补位格留空（off=true，不可点） */
function agendaCalendar(){
  var tdy=todayStr(), g=agendaGroups();
  var mk=agendaMonthKey();
  var y=Number(mk.split("-")[0]), mo=Number(mk.split("-")[1]);
  var first=new Date(y, mo-1, 1);
  var dim=new Date(y, mo, 0).getDate();          /* 当月天数 */
  /* getDay(): 0=周日；换算成「周一为 0」 */
  var lead=(first.getDay()+6)%7;
  var sel=agendaAnchor();
  var cells=[], cur=null;
  for(var i=0;i<42;i++){
    var dn=i-lead+1;
    if(dn>=1 && dn<=dim){
      var ds=ymdOf(new Date(y, mo-1, dn));
      var list=g.map[ds]||[];
      var list2=list.map(function(e){ return e.task; });
      var doneN=list2.filter(function(t){ return t.done; }).length;
      cells.push({date:ds, day:dn, off:false, today:ds===tdy, on:ds===sel,
                  n:list2.length, done:doneN, sub:list2.slice(0,2)});
      cur=ds;
    }else{
      cells.push({off:true});
    }
  }
  var wd=["一","二","三","四","五","六","日"];
  return {year:y, month:mo, cells:cells, wd:wd,
          label:y+" 年 "+mo+" 月"};
}

/* 不同范围下的分布图 */
function renderPomoRangeCharts(span){
 var all=state.pomoSessions||[];
 var now=new Date();
 var label="";
 var buckets={};
 function push(k,sec){buckets[k]=(buckets[k]||0)+sec;}
 if(span==='day'){
   label="今日 24 小时分布";
   for(var i=0;i<24;i++) buckets[i]=0;
   all.filter(function(s){return s.date===todayStr();}).forEach(function(s){var h=Number((s.startedAt||"00:00").slice(0,2))||0;buckets[h]+=s.minutes*60;});
 } else if(span==='week'){
   label="本周 7 天";
   for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var k=weekdayLabel(d)+" "+d.getDate();buckets[k]=0;}
   var d0=new Date(now); d0.setHours(0,0,0,0);
   d0.setDate(d0.getDate()-6);
   all.forEach(function(s){var dt=new Date(s.date+'T00:00:00'); if(dt>=d0){var wk=weekdayLabel(dt)+" "+dt.getDate();buckets[wk]=(buckets[wk]||0)+s.minutes*60;}});
 } else if(span==='month'){
   label="本月 30 天";
   var d1=new Date(now);d1.setHours(0,0,0,0);d1.setDate(d1.getDate()-29);
   for(var i=0;i<30;i++){var d=new Date(d1);d.setDate(d1.getDate()+i);buckets[d.getDate()]=0;}
   all.forEach(function(s){var dt=new Date(s.date+'T00:00:00'); if(dt>=d1){buckets[dt.getDate()]=(buckets[dt.getDate()]||0)+s.minutes*60;}});
 } else {
   label="全部累计";
   all.forEach(function(s){push(s.date,s.minutes*60);});
 }
 var keys=Object.keys(buckets);
 var max=Math.max.apply(null, keys.map(function(k){return buckets[k];}))||1;
 var totalSec=keys.reduce(function(a,k){return a+buckets[k];},0);
 var h='<div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">'+label+' · 共 <b style="color:var(--ink)">'+Math.round(totalSec/60)+'</b> 分钟</div>';
 if(span==='day'){
   h+='<div style="display:flex;gap:4px;height:80px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:4px">';
   for(var hr=0;hr<24;hr++){
     var v=buckets[hr]||0;var pct=Math.max(2,Math.round(v/max*100));

function insertResCard(html, card){
  var marker='<div class="res-grid">';
  var m=html.indexOf(marker);
  if(m<0) return html+'<div class="res-grid">'+card+'</div>';
  var i=m+marker.length, depth=1;
  while(i<html.length&&depth>0){
    var nd=html.indexOf('<div', i);
    var nc=html.indexOf('</div>', i);
    if(nc<0) break;
    if(nd>=0&&nd<nc){ depth++; i=nd+4; }
    else { depth--; i=nc+6; }
  }
  var closeAt=i-6;
  if(closeAt<0) return html+card;
  return html.slice(0,closeAt)+card+html.slice(closeAt);
}

/* 清空某一天的全部任务：保留空数组（不 delete），否则会被 todayTasks() 重新播种 */
function clearDayTasks(k){
  if(!k) k=todayStr();
  var n=(state.tasks[k]||[]).length;
  if(!n) return;
  if(!confirm("确定清空 "+k+" 的全部 "+n+" 条任务吗？此操作不可撤销。")) return;
  state.tasks[k]=[];        /* 保留键：表示「这一天存在但没有任务」 */

/* 就地编辑任务的目标时间（prompt 简单可靠，不引入额外 DOM 状态） */
function editTaskTime(el){  var id=el.getAttribute("data-id");
  var found=null;
  Object.keys(state.tasks||{}).forEach(function(k){
    ensureTaskDates(k);
    (state.tasks[k]||[]).forEach(function(t){ if(t.id===id) found=t; });
  });
  if(!found) return;
  var v=prompt("设置目标时间（可只填开始 07:30，或填区间 07:30~08:30）；留空则清除：", found.time||"");
  if(v===null) return;
  v=String(v).trim();
  if(v&&!hhmm2min(v.split(/[~～\-—到]/)[0])){ alert("格式不对，请按 07:30 或 07:30~08:30 填写"); return; }
  found.time=v;
  save();
  /* 日程栏页同样无 .ag-wrap，需整页重渲（时间胶囊 + 顺序都可能变） */
  if(cur==="plan-agenda"){ render(); return; }
  refreshPlanViews();
}

  var date=$("pr-date").value||todayStr();

  if(!total){ alert("请填写刷题数"); return; }
  var sel=$("pr-correct");
  var correct=(sel&&sel.options.length)?Number(sel.value):total;
  if(correct>total) correct=total;
  state.practice.push({id:uid(),date:date,subject:sub,total:total,correct:correct,range:$("pr-range").value.trim(),note:$("pr-note").value.trim()});
  save(); render();
}

var fx=null, fxParts=[];
function initParticles(){
  var cv=document.getElementById("fxCanvas"); if(!cv) return;
  fx=cv.getContext("2d");
  function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  resize(); window.addEventListener("resize",resize);
  for(var i=0;i<34;i++){ fxParts.push(mkFx(true)); }
  requestAnimationFrame(fxLoop);
}
function mkFx(ambient){
  var W=fx.canvas.width||1, H=fx.canvas.height||1;
  return {x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.4+0.6,
   vx:(Math.random()-0.5)*0.35, vy:(Math.random()-0.5)*0.35-0.12,
   life:ambient?9999:50, max:50, a:Math.random()*0.35+0.08,
   hue:Math.random()<0.5?"rgba(0,80,160,":"rgba(255,255,255,"};
}
var fxTick=0;
function fxLoop(){
  if(!fx) return;
  fxTick++;
  if(fxTick%2===0 && !document.hidden){
  var W=fx.canvas.width, H=fx.canvas.height;
  fx.clearRect(0,0,W,H);
  for(var i=fxParts.length-1;i>=0;i--){
    var p=fxParts[i];
    p.x+=p.vx; p.y+=p.vy;
    if(p.life===9999){ if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1; }
    if(p.life<9999){ p.life--; if(p.life<=0){ fxParts.splice(i,1); continue; } }
    var alpha=p.a*Math.min(1, p.life/(p.max*0.6));
    fx.beginPath(); fx.arc(p.x,p.y,p.r,0,Math.PI*2);
    fx.fillStyle=p.hue+alpha+")"; fx.fill();
  }
  }
  requestAnimationFrame(fxLoop);
}

}

var BK_SECTIONS = {"overview": {"chapters": []}, "s408": {"chapters": [{"name": "1. 目标与方法", "num": 1, "html": "<div class=\"card\"><h2>408计算机综合 目标分数：130/150</h2><div class=\"flow\"><span class=\"flow-step\">看课本</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">听课程</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">过书</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">记笔记</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">刷选择</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">看解析</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">A4标注</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">思维导图</span></div><span class=\"tag t1\">每日3h</span> <span class=\"tag t1\">王道+历年真题</span></div>\n\n<div class=\"card\"><h2>A4纸框架图复盘法</h2><div class=\"flow\"><span class=\"flow-step\">闭眼回忆5min</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">画主干10min</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">填关键词15min</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">红笔标薄弱5min</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">对照补全10min</span></div><div class=\"hl\">核心：合上书！能想起多少是多少。每章1-2张A4纸。考前只看框架图+错题本。</div></div>"}, {"name": "2. 阶段规划", "num": 2, "html": "<div class=\"card\"><h2>408 · 各阶段详细规划</h2><h3>6-8月 基础（4-5h/天）</h3><div class=\"hl\">王道+沈悦。学完一章做课后题+1800。顺序：DS-计组-OS-计网。</div><h3>8-9月 强化（4h/天）</h3><div class=\"hl\">DS：链表/二叉树/排序。计组：Cache/指令/运算。OS：调度/死锁/内存/文件。计网：TCP+UDP/IP地址。</div><h3>10-11月 真题冲刺（3-4h/天）</h3><div class=\"hl\">真题至少刷3遍。下午2-5点模拟。每个选项回到课本理解对应知识点。</div><h3>12月 考前回归（3-4h/天）</h3><div class=\"hl\">回归课本和错题。考前一周只看错题+背诵清单，不做新题。</div><h3>跨考408 · 三轮备考法</h3><div class=\"hl imp\">诀窍在于重复多轮。前置C/C++（浙大翁凯或王道C语言督学营PDF）。</div><h3>刷题铁律</h3><div class=\"hl\">看一章做一章，学新章翻前一章错题。DS+计网先-计组+OS后。前期只刷选择。铅笔标记。不额外做笔记直接在书上勾画。</div></div>\n\n<div class=\"card\"><h2>408复习经验 · 零壹体系</h2><h3>核心逻辑</h3><div class=\"hl imp\">理解重于死记，真题为王。避免钻牛角尖。</div><h3>资料</h3><div class=\"hl\">王道书+零壹全程课。历年真题+零壹讲义课后习题。</div><h3>学习顺序</h3><div class=\"hl\">DS>计组>OS>计网。课-书-题闭环。</div><h3>中期强化</h3><div class=\"hl\">DS+计网/计组+OS组合。听课-看书-真题。</div><h3>后期冲刺</h3><div class=\"hl\">真题09-20年套卷模拟，留最新两年全真。只推荐零壹模拟卷。</div><div class=\"hl imp\">避坑：警惕来源不明的资料及野题。</div></div>"}, {"name": "3. 月度计划", "num": 3, "html": "<div class=\"card\"><h2>月度备考计划</h2>\n<div class=\"month-card\"><h4>1月</h4><label><input type=\"checkbox\" data-id=\"408_month_0\"><span style=\"font-size:.8rem\">DS基础:看课本-听课-选择题</span></label></div>\n<div class=\"month-card\"><h4>2月</h4><label><input type=\"checkbox\" data-id=\"408_month_1\"><span style=\"font-size:.8rem\">DS:二叉树/图/查找排序</span></label></div>\n<div class=\"month-card\"><h4>3月</h4><label><input type=\"checkbox\" data-id=\"408_month_2\"><span style=\"font-size:.8rem\">DS收尾+计组预习</span></label></div>\n<div class=\"month-card\"><h4>4月</h4><label><input type=\"checkbox\" data-id=\"408_month_3\"><span style=\"font-size:.8rem\">计组基础+C语言</span></label></div>\n<div class=\"month-card\"><h4>5月</h4><label><input type=\"checkbox\" data-id=\"408_month_4\"><span style=\"font-size:.8rem\">OS基础+每周一套卷</span></label></div>\n<div class=\"month-card\"><h4>6月</h4><label><input type=\"checkbox\" data-id=\"408_month_5\"><span style=\"font-size:.8rem\">基础收尾进强化</span></label></div>\n<div class=\"month-card\"><h4>7月</h4><label><input type=\"checkbox\" data-id=\"408_month_6\"><span style=\"font-size:.8rem\">计网基础+DS强化+算法题</span></label></div>\n<div class=\"month-card\"><h4>8月</h4><label><input type=\"checkbox\" data-id=\"408_month_7\"><span style=\"font-size:.8rem\">计组强化+OS强化+计网强化</span></label></div>\n<div class=\"month-card\"><h4>9月</h4><label><input type=\"checkbox\" data-id=\"408_month_8\"><span style=\"font-size:.8rem\">分类真题09-15</span></label></div>\n<div class=\"month-card\"><h4>10月</h4><label><input type=\"checkbox\" data-id=\"408_month_9\"><span style=\"font-size:.8rem\">真题套卷+WD \"t-text\">固定每日 14:00-17:00 为 408 时间</span></div>\n<div class=\"task\"><input type=\"checkbox\" data-id=\"g408_ck5\"><span class=\"t-text\">入手/整理 408 思维导图，安排每晚 21:30 滚动复盘 30min</span></div>\n<div class=\"task\"><input type=\"checkbox\" data-id=\"g408_ck6\"><span class=\"t-text\">收集近 10 年 408 真题（2009 起）PDF 并做 OCR 可搜索版</span></div>\n<div class=\"task\"><input type=\"checkbox\" data-id=\"g408_ck7\"><span class=\"t-text\">背熟常用算法模板（链表 / 二叉树 / 排序 / 图）</span></div>\n</div>"}, {"name": "6. 推荐资源", "num": 6, "html": "<div class=\"card\"><h2>408 推荐资源 · 按科目汇总</h2>\n<div class=\"hl\">同一位老师只列在最相关的科目下；跨科目的（如湖科大教书匠覆盖计组＋计网）在「适合场景」里标注。</div>\n<h3>🔄 全程通用</h3>\n<table style=\"width:100%;margin:6px 0\">\n<tr><th style=\"width:20%\">老师 / 博主</th><th>特点</th><th style=\"width:34%\">适合场景</th></tr>\n<tr><td><b>王道</b></td><td>不用多说</td><td>课本＋真题＋模拟，<b>全程主跟</b></td></tr>\n<tr><td><b>残云1448</b></td><td>湖科大每日一题讲解</td><td>每日一题跟练</td></tr>\n<tr><td><b>复旦发哥带学408</b></td><td>真题大题讲解非常细，每个大题基本花半小时讲解</td><td>做真题大题有不理解时</td></tr>\n</table>\n<h3>🌳 数据结构</h3>\n<table style=\"width:100%;margin:6px 0\">\n<tr><th style=\"width:20%\">老师 / 博主</th><th>特点</th><th style=\"width:34%\">适合场景</th></tr>\n<tr><td><b>蓝不过海呀</b></td><td>数据结构可视化博主</td><td>复习数据结构时看，可视化非常清晰，快速想起之前的知识</td></tr>\n<tr><td><b>我头发多还能学</b></td><td>讲算法的博主，非常适合小白</td><td>真题算法课程，对算法有一定理解</td></tr>\n<tr><td><b>一休强化讲义</b></td><td>DS 算法大题专项讲义</td><td>强化阶段专攻算法大题</td></tr>\n</table>\n<h3>⚙️ 计算机组成原理</h3>\n<table style=\"width:100%;margin:6px 0\">\n<tr><th style=\"width:20%\">老师 / 博主</th><th>特点</th><th style=\"width:34%\">适合场景</th></tr>\n<tr><td><b>咸鱼</b></td><td>王道主讲，擅长存储系统</td><td>计组存储系统</td></tr>\n<tr><td><b>里昂</b></td><td>海明码＋强化课</td><td>海明码专题、强化阶段</td></tr>\n<tr><td><b>beokayy</b></td><td>擅长总结知识点，让你对知识有整体框架；计组第二章讲得非常好</td><td>计组第二章救命；王道书课后选择题讲解清楚</td></tr>\n</table>\n<h3>💻 操作系统</h3>\n<table style=\"width:100%;margin:6px 0\">\n<tr><th style=\"width:20%\">老师 / 博主</th><th>特点</th><th style=\"width:34%\">适合场景</th></tr>\n<tr><td><b>BOK</b></td><td>文件管理讲得好</td><td>OS 文件管理章节</td></tr>\n</table>\n<h3>🌐 计算机网络</h3>\n<table style=\"width:100%;margin:6px 0\">\n<tr><th style=\"width:20%\">老师 / 博主</th><th>特点</th><th style=\"width:34%\">适合场景</th></tr>\n<tr><td><b>湖科大教书匠</b></td><td>高校老师，水平非常高，主讲计组和计网；每日一题＋模拟卷</td><td>计网比王道更全面，听完王道后强化再听查缺补漏；计组第二、三章也可看</td></tr>\n</table>\n</div>"}, {"name": "7. 每日任务卡", "num": 7, "html": "<div class=\"card task-card\"><h2>每日任务卡 (可打印)</h2><button class=\"print-btn\" onclick=\"printTaskCard(this)\">打印任务卡</button>\n<div class=\"template\"><h3>408 每日任务卡</h3>\n<div class=\"template-line\"><input type=\"checkbox\"> 选择题 ____道（科目：________）用时：____</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 算法题 1道（______________）用时：____</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 大题 ____道（______________）用时：____</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 回顾昨日错题（____道）| PV操作默写</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 看课本/课程（章节：__________）| 思维导图/A4纸总结</div>\n<div style=\"font-weight:600;margin-top:8px\">错题记录（为什么错）</div><div class=\"template-box\"></div>\n<div style=\"margin-top:8px\">明日重点：________________________________</div>\n</div></div>"}]}, "math": {"chapters": [{"name": "1. 目标与原则", "num": 1, "html": "<div class=\"card\"><h2>数学一 目标分数：130/150</h2><div class=\"flow\"><span class=\"flow-step\">高数</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">线代</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\">概率论</span></div><span class=\"tag t2\">每日4h</span> <span class=\"tag t2\">不要比进度</span></div>"}, {"name": "2. 规划体系", "num": 2, "html": "<div class=\"fold-card open\" id=\"fold_zhangyu\">\n<div class=\"fold-header\" onclick=\"toggleFold('fold_zhangyu')\"><h2 style=\"color:var(--c2)\">秘密哥 · 张宇路线（主线）</h2><span class=\"fold-arrow\">&#9660;</span></div>\n<div class=\"fold-body\"><div class=\"card\"><h2>高数阶段规划 · 1000A正确率分岔路线</h2>\n\t\t<div class=\"hl\">张宇派习题册顺序：<span class=\"tag t2\">1000A</span> <span class=\"flow-arrow\">→</span> <span class=\"tag t3\">880基础</span> <span class=\"flow-arrow\">→</span> <span class=\"tag t2\">1000B</span> <span class=\"flow-arrow\">→</span> <span class=\"tag t4\">880综合</span></div>\n\t\t<h3>1000A正确率 ≥ 70%（高手路线）</h3>\n\t\t<div class=\"hl\">学完基础 → 二刷三十讲（自学不看课）+ 1000A错题二刷 + 880基础（或660）+ 同时开线代（5:5）。线代期间绝对不能因为线代就不学高数。</div>\n\t\t<h3>1000A正确率 50%~70%（蓝开标准路线）</h3>\n\t\t<div class=\"hl\">学完基础 → 二刷三十讲（自学不看课）+ 1000A错题二刷 + 同时开线代（5:5）。线代高数时间占比五五开，绝对不因为线代就不学高数。</div>\n\t\t<h3>1000A正确率 40%~50%（搭配强化路线）</h3>\n\t\t<div class=\"hl\">学完基础 + 每天十道错题 → 看<b>24张宇强化</b>（最推荐，苦瓜学长有电子资源）或<b>武忠祥强化</b>（其次）→ 先听课 → 做完强化讲义题目 → 二刷基础三十讲此部分 → 再做1000A错题。</div>\n\t\t<h3>1000A正确率 ≤ 40%（底线路线）</h3>\n\t\t<div class=\"hl imp\">基础阶段先别做1000A，或者换老师。如果不换老师，按40~50%路线执行，但1000A错题变成1000A新题。</div>\n\t\t</div>\n\n\t<div class=\"card\"><h2>概率论规划（数学一/三专属）</h2>\n\t\t<h3>时间 &amp; 强度</h3>\n\t\t<div class=\"hl\">基础强化最多1.5个月结束。如果碰上期末周，暂时不开等期末周过去。一旦进入概率论，学习强度一点不能低，三门齐开，是数一数三最痛苦的阶段，不允许摆烂。</div>\n\t\t<h3>时间分配</h3>\n\t\t<div class=\"hl imp\">概率论 :（高数+线代）= 5 : 5。高数和线代自行分配，可3:2或5:5。</div>\n\t\t<h3>基础阶段</h3>\n\t\t<div class=\"hl\">推荐老师：<b>姜晓千</b>。搭配对应团队配套习题册基础篇，听一章做一章。结束基础后直接进入强化。</div>\n\t\t<h3>强化阶段</h3>\n\t\t<div class=\"hl\">推荐老师：<b>方浩</b>。听完一章强化课 → 二刷对应的基础讲义 + 基础习题册错题 → 做强化讲义 → 下一章。如果基础强化老师不同，注意章节对应关系（如A老师第一二章 = B老师第一章，则B老师第一章学完后二刷A老师第一二章）。</div>\n\t\t</div>\n\n\t<div class=\"card\"><h2>二刷&amp;三刷三十讲 · 完整方法论</h2>\n\t\t<h3>二刷三十讲（顺序：先看讲义 → 再做习题）</h3>\n\t\t<div class=\"hl\">先把讲义内容全部完成：<b>看知识点 → 做例题 → 做课后习题</b>。然后做对应1000A的错题。每天十道错题。</div>\n\t\t<h3>三刷三十讲（顺序：先做习题 → 再看讲义）</h3>\n\t\t<div class=\"hl\">先做<b>880拼好卷</b>（或1000B拼好卷）→ 做完后根据错误章节回归到三十讲对应内容 → <b>看知识点 + 做课后习题 + 做例题</b> → <b>A4大法</b>。</div>\n\t\t<h3>两轮核心区别</h3>\n\t\t<table><tr><th></th><th>顺序</th><th>核心动作</th></tr>\n\t\t<tr><td><b>二刷</b></td><td>先看讲义 → 再做习题</td><td>知识点→例题→课后题→1000A错题</td></tr>\n\t\t<tr><td><b>三刷</b></td><td>先做习题 → 再看讲义</td><td>880拼好卷→错误章节回归→知识点+课后题+例题→A4大法</td></tr></table>\n\t\t<div class=\"hl imp\">每天十道错题雷打不动。1000讲解看千羽总结。</div>\n\t\t<h3>拼好卷格式</h3>\n\t\t<div class=\"hl\">10选择+6填空+6解答（或减半：5+3+3）。只选各章节基础篇题目组卷。根据扣分点乱序回归三十讲对应章节。</div>\n\t\t<div class=\"hl imp\"><b>执行时机备注：</b>拼好卷需<b>二刷之后</b>才做；执行完后接着做 <b>880 / 1000B 的新错题</b>。</div>\n\t\t<h3>三刷期间各科目并行状态</h3>\n\t\t<table><tr><th>考生类型</th><th>线代</th><th>概率论</th></tr>\n\t\t<tr><td><b>数学二</b></td><td>二刷线代强化讲义 + 880基础</td><td style=\"color:var(--muted)\">—</td></tr>\n\t\t<tr><td><b>数学一/三</b></td><td>二刷强化讲义 + 880基础篇</td><td>学习中（基础→强化）</td></tr></table>\n\t\t<div class=\"hl\">补弱：碰到不行章节看UP专题课或其他老师强化课，不要当极端耐刷王。三十讲有必要三刷。</div>\n\t\t</div>\n\n<div class=\"card\"><h2>秘密哥 · 每日任务检查清单</h2>\n\t<ul class=\"clist\">\n\t<li><label><input type=\"checkbox\" data-id=\"mixin_ck_hmath\"> 高数学习时间 ≥ 2h（线代期间）</label></li>\n\t<li><label><input type=\"checkbox\" data-id=\"mixin_ck_linalg\"> 线代学习时间 ≥ 2h（线代期间）</label></li>\n\t<li><label><input type=\"checkbox\" data-id=\"mixin_ck_wrong\"> 每天十道错题（来自当前章节之外的章节）</label></li>\n\t<li><label><input type=\"checkbox\" data-id=\"mixin_ck_review\"> 二刷讲义任务推进</label></li>\n\t<li><label><input type=\"checkbox\" data-id=\"mixin_ck_a4\"> 如有余力：秘密A4任务</label></li>\n\t</ul></div>\n\n\t<div class=\"card\"><h2>秘密哥 · 阶段里程碑</h2>\n\t<table><tr><th>阶段</th><th>里程碑</th><th>完成</th></tr>\n\t<tr><td>高数基础一刷</td><td>三十讲全部学完</td><td><input type=\"checkbox\" data-id=\"mixin_ms_1\"></td></tr>\n\t<tr><td>高数基础二刷</td><td>三十讲二刷 + 1000A错题</td><td><input type=\"checkbox\" data-id=\"mixin_ms_2\"></td></tr>\n\t<tr><td>线代基础</td><td>所跟老师基础讲义全部学完</td><td><input type=\"checkbox\" data-id=\"mixin_ms_3\"></td></tr>\n\t<tr><td>线代强化</td><td>强化讲义 + 二刷基础讲义</td><td><input type=\"checkbox\" data-id=\"mixin_ms_4\"></td></tr>\n\t<tr><td>习题一轮</td><td>1000A 完成</td><td><input type=\"checkbox\" data-id=\"mixin_ms_5\"></td></tr>\n\t<tr><td>习题二轮</td><td>880基础 完成</td><td><input type=\"checkbox\" data-id=\"mixin_ms_6\"></td></tr>\n\t<tr><td>习题三轮</td><td>1000B 完成</td><td><input type=\"checkbox\" data-id=\"mixin_ms_7\"></td></tr>\n\t<tr><td>习题四轮</td><td>880综合 完成</td><td><input type=\"checkbox\" data-id=\"mixin_ms_8\"></td></tr>\n\t<tr><td>真题阶段</td><td>拼好卷训练 → 真题卷</td><td><input type=\"checkbox\" data-id=\"mixin_ms_9\"></td></tr>\n\t<tr><td>秘密A4任务</td><td>A4大法执行</td><td><input type=\"checkbox\" data-id=\"mixin_ms_10\"></td></tr>\n\t</table>\n\t<div class=\"pb\"><div class=\"pf p2\" id=\"mixinMilestoneProgress\" style=\"width:0%\"></div></div><span style=\"font-size:.75rem;color:var(--muted)\" id=\"mixinMilestoneProgressText\">0/10</span></div>\n</div>\n</div>\n"}, {"name": "3. 专题清单", "num": 3, "html": "<div class=\"card\"><h2>数学专题清单 + 推荐老师</h2><table><tr><th>专题</th><th>推荐老师</th><th>状态</th></tr>\n<tr><td>高阶导数</td><td>凯哥</td><td><input type=\"checkbox\" data-id=\"math_topic_7701\"></td></tr>\n<tr><td>条件极值</td><td>没咋了</td><td><input type=\"checkbox\" data-id=\"math_topic_7702\"></td></tr>\n<tr><td>数列极限（概念）</td><td>没咋了</td><td><input type=\"checkbox\" data-id=\"math_topic_315\"></td></tr>\n<tr><td>数列极限证明</td><td>考研竞赛凯哥（epsilon-delta）</td><td><input type=\"checkbox\" data-id=\"math_topic_7610\"></td></tr>\n<tr><td>反常积分</td><td>阿赞学长</td><td><input type=\"checkbox\" data-id=\"math_topic_9631\"></td></tr>\n<tr><td>中值定理证明</td><td>夜雨、凯哥</td><td><input type=\"checkbox\" data-id=\"math_topic_5903\"></td></tr>\n<tr><td>泰勒公式</td><td>epsilon-delta</td><td><input type=\"checkbox\" data-id=\"math_topic_7703\"></td></tr>\n<tr><td>不等式证明</td><td>考研竞赛凯哥总结（epsilon-delta）</td><td><input type=\"checkbox\" data-id=\"math_topic_4243\"></td></tr>\n<tr><td>二重积分求旋转体体积</td><td>武忠祥、郭伟</td><td><input type=\"checkbox\" data-id=\"math_topic_7704\"></td></tr>\n<tr><td>积分的几何应用（旋转体体积）</td><td>考研数学郭伟</td><td><input type=\"checkbox\" data-id=\"math_topic_7705\"></td></tr>\n<tr><td>斜直线（二重积分求解法）</td><td>武老</td><td><input type=\"checkbox\" data-id=\"math_topic_7706\"></td></tr>\n<tr><td>微分方程</td><td>张宇</td><td><input type=\"checkbox\" data-id=\"math_topic_6585\"></td></tr>\n<tr><td>微分方程的几何应用</td><td>郭伟（强化后深究，可通过真题学习）</td><td><input type=\"checkbox\" data-id=\"math_topic_7707\"></td></tr>\n<tr><td>积分的物理应用</td><td>凯哥（ t<h3>不会做的题（能力问题）</h3>\n\t<div class=\"hl\">三步走，层层递进：</div>\n\t<div class=\"hl\"><b>1. 自己研究答案</b> — 找出卡在哪一步 → 分析卡住的这一步对应题目里什么信息（条件没读透？知识点没关联上？）→ 对比自己思路和答案的区别</div>\n\t<div class=\"hl\"><b>2. 看讲解</b> — 看完第二天再独立做一遍，重新研究答案</div>\n\t<div class=\"hl\"><b>3. 还是不会</b> — 先标记存档，隔一段时间再回头做</div>\n\t<h3 style=\"margin-top:12px\">会做但做错的题（习惯问题）</h3>\n\t<table><tr><th>错误类型</th><th>对策</th></tr>\n\t<tr><td>概念记忆错误</td><td>翻书查看，回归教材</td></tr>\n\t<tr><td>计算错误</td><td>优化草稿纸使用习惯（书写整齐、分区、留痕）</td></tr>\n\t<tr><td>做题习惯错误</td><td>优化整体做题流程习惯</td></tr></table>\n\t<h3 style=\"margin-top:12px\">总结的本质</h3>\n\t<div class=\"hl imp\">不是简单默写知识点，而是借框架、抓两点</div>\n\t<div class=\"hl\"><b>借框架：</b>利用课/书提供的知识框架（如武忠祥知识点分布表、30讲知识框架图），在别人的框架下分类整理自己的知识点+做过的题目</div>\n\t<div class=\"hl\"><b>抓两点：</b>① 题目会从哪些方向考察 ② 自己的易错点是哪些</div>\n\t<div class=\"hl\"><b>时机（颜色标记法）：</b>高数基础 — 30讲+1000A二刷完毕且另一本习题册完成后开始；线代+概率 — 每节强化课结束后开始</div>\n\t<div style=\"font-size:.78rem;color:var(--muted);margin-top:8px\">总结花费时间，不要一次性构建完全，随学随补、持续迭代。错题处理是\"战术动作\"，方法总结是\"战略归档\"——两者是一套组合拳。</div>\n\t</div>\n\n<div class=\"card\"><h2>A4默写大法（费曼学习法）</h2><div class=\"hl imp\">只能强化阶段及以后使用。张宇：二刷三十讲时做（1000A正确率60%+）；武忠祥：强化时做（严选题70%+）。</div><div class=\"hl\">看讲义-合上书-白纸默写框架-绞尽脑汁后翻开书用红笔补全。一讲最多30min。抄写=浪费时间。</div></div>"}, {"name": "5. 真题与模拟", "num": 5, "html": "<div class=\"card\"><h2>真题刷题追踪（2003-2026）</h2><p style=\"font-size:.78rem;color:var(--muted)\">近15年重点反复刷 | 21年后反复刷</p><table><tr><th>年份</th><th>1遍</th><th>2遍</th><th>分1</th><th>分2</th><th>复盘</th></tr>\n<tr><td><b>2003</b></td><td><input type=\"checkbox\" data-id=\"math_r1_2003\"></td><td><input type=\"checkbox\" data-id=\"math_r2_2003\"></td><td><input type=\"text\" class=\"exam-score\" data-id=\"math_s1_2003\" placeholder=\"-\"></td><td><input type=\"text\" class=\"exam-score\" data-id=\"math_s2_2003\" placeholder=\"-\"></td><td><input type=\"checkbox\" data-id=\"math_rev_2003\"></td></tr>\n<tr><td><b>2004</b></td><td><input type=\"checkbox\" data-id=\"math_r1_2004\"></td><td><input type=\"checkbox\" d _______）用时：____</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 概率 ____道（______________）用时：____</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 回顾昨日错题（____道）</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 看讲义/课程（章节：__________）| 知识框架默写</div>\n<div style=\"font-weight:600;margin-top:8px\">错题记录（为什么错）</div><div class=\"template-box\"></div>\n<div style=\"margin-top:8px\">明日重点：________________________________</div>\n</div></div>"}]}, "english": {"chapters": [{"name": "1. 单词攻坚", "num": 1, "html": "<div class=\"card\" style=\"border:2px solid var(--c3)\"><h2 style=\"color:var(--c3)\">CS背书法 · 20天搞定考研单词</h2>\n\n<h3>准备材料</h3>\n<table><tr><td>乱序单词书一本</td><td>含考纲全部词汇，A4纸挡住中文只露英文</td></tr>\n<tr><td>15~20天整段学习时间</td><td>尽量不要中断，最多允许1-2天</td></tr>\n<tr><td>面对生理性不适的勇气</td><td>短时间高强度记忆必然产生身体反应，接受它</td></tr>\n<tr><td>每天6小时记忆时间</td><td>其他学科暂且让步</td></tr></table>\n\n<h3 style=\"margin-top:12px\">20天安排（单词书均分10份 A~J）</h3>\n<div class=\"hl\">最重要/最难背的放 A 和 J。一天两次主战场：<b>早上起床后 + 晚上临睡前</b>。</div>\n<table style=\"font-size:.75rem\"><tr><th>天数</th><th>新学</th><th>复习</th><th></th><th>天数</th><th>新学</th><th>复习</th></tr>\n<tr><td>D1</td><td>A</td><td>A</td><td></td><td>D11</td><td>D</td><td>HJ</td></tr>\n<tr><td>D2</td><td>B</td><td>AB</td><td></td><td>D12</td><td>E</td><td>I</td></tr>\n<tr><td>D3</td><td>C</td><td>BC</td><td></td><td>D13</td><td>F</td><td>J</td></tr>\n<tr><td>D4</td><td>D</td><td>ACD</td><td></td><td>D14</td><td>G</td><td>—</td></tr>\n<tr><td>D5</td><td>E</td><td>BDE</td><td></td><td>D15</td><td>AH</td><td>—</td></tr>\n<tr><td>D6</td><td>F</td><td>CEF</td><td></td><td>D16</td><td>BI</td><td>—</td></tr>\n<tr><td>D7</td><td>G</td><td>DFG</td><td></td><td>D17</td><td>CJ</td><td>—</td></tr>\n<tr><td>D8</td><td>AH</td><td>EGH</td><td></td><td>D18</td><td>D</td><td>—</td></tr>\n<tr><td>D9</td><td>BI</td><td>FHI</td><td></td><td>D19</td><td>E</td><td>—</td></tr>\n<tr><td>D10</td><td>CJ</td><td>GIJ</td><td></td><td>D20</td><td>F</td><td>—</td></tr></table>\n<div class=\"hl imp\">D10 学完一轮。8-10 天最痛苦，撑过去就赢了。D10 后任务量明显减轻，但不可放松。</div>\n\n<h3>学新知 · 操作方法</h3>\n<div class=\"hl imp\">第一要义是快！不要管拼写和熟词生义。</div>\n<div class=\"hl\">① 每个单词默读 3 遍英文+中文（pig猪pig猪pig猪）</div>\n<div class=\"hl\">② 背完一页 → 白纸盖住中文，2秒内说出 → 不行继续3遍</div>\n<div class=\"hl\">③ 每隔 5 分钟 → 检查这 5 分钟内容</div>\n<div class=\"hl\">④ 每隔 30 分钟 → 检查这 30 分钟内容</div>\n<div class=\"hl\" style=\"color:var(--muted)\">三种检查：每页 + 5分钟 + 30分钟</div>\n\n<h3>复习 · 操作方法</h3>\n<div class=\"hl\">直接上手检查，不必循环。正确率低于 70% → 重复新知操作。不纠结一次记住多少，反复过筛子，不是一击必杀。</div>\n\n<h3>重点打击（13天后）</h3>\n<div class=\"hl\">总览全书，把反复背反复忘的词整理出来，加到每日主战场，一日两背持续7天。硬怼，拼命！</div>\n\n<h3>生理反应时间线</h3>\n<table style=\"font-size:.72rem\"><tr><th>时间</th><th>症状</th><th>应对</th></tr>\n<tr><td>D2</td><td>厌学，生理不适</td><td>知耻后勇</td></tr>\n<tr><td>D4</td><td>轻度头疼、睡眠浅（做梦都是单词）</td><td>忍着！允许多睡</td></tr>\n<tr><td>D7</td><td>脑雾，呕吐感</td><td>流食清淡，减少其他学科，多户外</td></tr>\n<tr><td>D10</td><td>头昏脑涨，但程度好转</td><td>忍着！逐渐恢复其他学科</td></tr>\n<tr><td>D13</td><td>主战场只剩一个</td><td>恢复正常</td></tr></table>\n\n<div class=\"hl imp\" style=\"margin-top:8px\">本质 = 高频重复 + 间隔递减 + 过筛式淘汰。不需要拼写、不做笔记，只需要快速度过、反复检查、把记不住的揪出来反复怼。</div>\n</div>"}, {"name": "2. 真题与题型", "num": 2, "html": "<div class=\"card\"><h2>秘密哥 · 翻译训练 &amp; 外刊</h2>\n\t\t<h3>练习目的</h3>\n\t\t<div class=\"hl\">不是为了积累超纲词，而是练习<b>单词都认识的情况下怎么把长难句翻译出来</b>。不认识的词要提前查出来。</div>\n\t\t<h3>练习方法</h3>\n\t\t<div class=\"hl\">背第二轮单词时，去苦瓜学长推荐的考研英语外刊阅读公众号看每日发文（虽是外刊来源但是一段段的，设计好看，和传统外刊不同）。每天跟翻译其中一段，不明白的问<b>豆包</b>（最好的语法老师）。练一段时间后心中自然明白如何断句和翻译。</div>\n\t\t<h3>翻译水平上来后</h3>\n\t\t<div class=\"hl\">1~2轮单词背完 + 翻译训练完成 → 可以去实战阅读了。</div>\n\t\t</div>\n\n\t\n<div class=\"card\"><h2>秘密哥 · 真题 &amp; 阅读全套策略</h2>\n\t\t<h3>真题选购</h3>\n\t\t<div class=\"hl imp\">考研英语只做真题，模拟题扔了。只推荐买不到20米包邮的牛皮纸真题册，买两份（要二刷）。几十几百的没必要，网上有电子版解析。第一遍用铅笔做，不敢写太狠怕留痕迹耽误二刷。</div>\n\t\t<h3>阅读方法论（四六级没过/擦边过的必看）</h3>\n\t\t<div class=\"hl\">苦瓜学长上放的唐迟18年阅读方法论，96-04只8个视频，一周内解决。</div>\n\t\t<h3>年份范围 &amp; 起步</h3>\n\t\t<div class=\"hl\">从<b>07年</b>开始做（10年前不分英一英二）。07-09的8篇阅读当作起步入状态的献祭篇。总共07-26共20年每年4篇=80篇。12月前做17年，留3年12月模拟：<b>英一留16,17,18；英二留14,17,18</b>，12月以套卷形式做。</div>\n\t\t<h3>2~3天一篇节奏（灵活调整）</h3>\n\t\t<table><tr><th>Day</th><th>任务</th></tr>\n\t\t<tr><td><b>Day 1</b></td><td>限时完成阅读 → 对答案 → 看网上电子解析思考为什么错 → 看柴荣/田瀚博讲解掰正错误思想</td></tr>\n\t\t<tr><td><b>Day 2</b></td><td>精读精翻：把熟词僻义、生词、词组记到手机备忘录上，背一背</td></tr>\n\t\t<tr><td><b>Day 3</b></td><td>再思考拷打自己怎么错的、为什么错，掰正思想（2天节奏则Day 2一并完成）</td></tr></table>\n\t\t<h3>二刷 &amp; DDL</h3>\n\t\t<div class=\"hl\">由于要刷两遍，不一定固定3天一篇，可2天灵活。12月前共17年真题，<b>尽量12月1号前二刷完</b>。一旦开始阅读，绝对不能超过3天不做下一篇！望严肃执行！</div>\n\t\t</div>\n\n\t\n<div class=\"card\"><h2>秘密哥 · 阅读后各题型策略</h2>\n\t\t<h3>新题型（阅读一刷结束 / 二刷开始时开）</h3>\n\t\t<div class=\"hl\">重要程度仅次于阅读，每题2分，客观难度比阅读低，尽量拿满。可看<b>刘琦</b>方法论，阅读有实力也可以不看。</div>\n\t\t<h3>翻译（新题型之后开）</h3>\n\t\t<div class=\"hl\">方法论看<b>柴荣</b>。核心就三个字：<b>说人话</b>。翻译不是突击的，完全看你平时单词有没有坚持背，希望大家不要断断续续地背单词。</div>\n\t\t<h3>完型（最后开 · 最不重要）</h3>\n\t\t<div class=\"hl\">一个才0.5分，全错也就扣10分。成绩向上取整没有.5。看课性价比最低，其他科目夯爆了才考虑看方法论，否则没必要。</div>\n\t\t<h3>作文（八月底开 · 不看课）</h3>\n\t\t<div class=\"hl imp\">和阅读同样重要但稍次。不需要花时间看课，推荐<b>苦瓜学长</b>（小众高级），后台回复\"作文\"即可。八月底开，几乎不花时间就干碎作文。今年出分反馈在主页简介。</div>\n\t\t</div>"}, {"name": "3. 计划与进度", "num": 3, "html": "<div class=\"card\"><h2>月度备考计划</h2>\n<div class=\"month-card\"><h4>1月</h4><label><input type=\"checkbox\" data-id=\"eng_month_0\"><span style=\"font-size:.8rem\">词汇200词/日+长难句1-2个</span></label></div>\n<div class=\"month-card\"><h4>2月</h4><label><input type=\"checkbox\" data-id=\"eng_month_1\"><span style=\"font-size:.8rem\">词汇持续+暑假前背完一轮</span></label></div>\n<div class=\"month-card\"><h4>3月</h4><label><input type=\"checkbox\" data-id=\"eng_month_2\"><span style=\"font-size:.8rem\">词汇收尾+长难句继续</span></label></div>\n<div class=\"month-card\"><h4>4月</h4><label><input type=\"checkbox\" data-id=\"eng_month_3\"><span style=\"font-size:.8rem\">阅读05-09:一天一篇+精翻</span></label></div>\n<div class=\"month-card\"><h4>5月</h4><label><input type=\"checkbox\" data-id=\"eng_month_4\"><span style=\"font-size:.8rem\">阅读10-21:一天2-3篇+方法论</span></label></div>\n<div class=\"month-card\"><h4>6月</h4><label><input type=\"checkbox\" data-id=\"eng_month_5\"><span style=\"font-size:.8rem\">阅读10-21继续+单词至少两轮</span></label></div>\n<div class=\"month-card\"><h4>7月</h4><label><input type=\"checkbox\" data-id=\"eng_month_6\"><span style=\"font-size:.8rem\">新题型(柴荣/刘琦)</span></label></div>\n<div class=\"month-card\"><h4>8月</h4><label><input type=\"checkbox\" data-id=\"eng_month_7\"><span style=\"font-size:.8rem\">翻译(唐静)+大作文准备</span></label></div>\n<div class=\"month-card\"><h4>9月</h4><label><input type=\"checkbox\" data-id=\"eng_month_8\"><span style=\"font-size:.8rem\">完型填空(易熙人/柴荣)</span></label></div>\n<div class=\"month-card\"><h4>10月</h4><label><input type=\"checkbox\" data-id=\"eng_month_9\"><span style=\"font-size:.8rem\">2022前真题再刷+通篇翻译</span></label></div>\n<div class=\"month-card\"><h4>11月</h4><label><input type=\"checkbox\" data-id=\"eng_month_10\"><span style=\"font-size:.8rem\">作文:整理模板+背诵20篇</span></label></div>\n<div class=\"month-card\"><h4>12月</h4><label><input type=\"checkbox\" data-id=\"eng_month_11\"><span style=\"font-size:.8rem\">2022-2026模考+AI批改作文</span></label></div>\n<div class=\"pb\"><div class=\"pf p3\" id=\"planEngProgress\" style=\"width:0%\"></div></div><span style=\"font-size:.75rem;color:var(--muted)\" id=\"planEngProgressText\">0/12</span></div>\n\n<div class=\"card\"><h2>词汇进度</h2><div style=\"margin:8px 0\"><label><input type=\"checkbox\" data-id=\"eng_vocab_r1\"> 第一轮完成（暑假前DDL）</label></div><div style=\"margin:8px 0\"><label><input type=\"checkbox\" data-id=\"eng_vocab_r2\"> 第二轮完成</label></div><div class=\"pb\"><div class=\"pf p3\" id=\"vocabProgress\" style=\"width:0%\"></div></div></div>\n\n<div class=\"card\"><h2>阅读真题进度（2005-2026）</h2><table><tr><th>年份</th><th>完成</th><th>精翻</th><th>得分</th><th>错题分析</th></tr>\n<tr><td><b>2005</b></td><td><input type=\"checkbox\" data-id=\"eng_r_2005\"></td><td><input type=\"checkbox\" data-id=\"eng_t_2005\"></td><td><input type=\"text\" class=\"exam-s ><td><b>2026</b></td><td><input type=\"checkbox\" data-id=\"eng_r_2026\"></td><td><input type=\"checkbox\" data-id=\"eng_t_2026\"></td><td><input type=\"text\" class=\"exam-score\" data-id=\"eng_s_2026\" placeholder=\"-\"></td><td><input type=\"checkbox\" data-id=\"eng_e_2026\"></td></tr>\n</table></div>"}, {"name": "4. 推荐资源", "num": 4, "html": "<div class=\"card\"><h2>推荐资源</h2><div class=\"res-grid\">\n<div class=\"res-card\"><strong>柴荣/刘琦</strong><span>新题型</span></div>\n<div class=\"res-card\"><strong>唐静</strong><span>翻译技巧课</span></div>\n<div class=\"res-card\"><strong>易熙人/柴荣</strong><span>完形填空</span></div>\n<div class=\"res-card\"><strong>冲刺背诵20篇</strong><span>作文模板</span></div>\n<div class=\"res-card\"><strong>30个功能句</strong><span>作文句式</span></div>\n<div class=\"res-card\"><strong>AI批改</strong><span>作文评分</span></div>\n</div></div>"}, {"name": "5. 每日任务卡", "num": 5, "html": "<div class=\"card task-card\"><h2>每日任务卡 (可打印)</h2><button class=\"print-btn\" onclick=\"printTaskCard(this)\">打印任务卡</button>\n<div class=\"template\"><h3>英语 每日任务卡</h3>\n<div class=\"template-line\"><input type=\"checkbox\"> 单词 ____个（用时：____）</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 阅读 ____篇（年份：____）用时：____</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 长难句分析 ____句</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 回顾昨日错题（____道）</div>\n<div class=\"template-line\"><input type=\"checkbox\"> 作文练习 / 背功能句</div>\n<div style=\"font-weight:600;margin-top:8px\">错题记录（为什么错）</div><div class=\"template-box\"></div>\n<div style=\"margin-top:8px\">明日重点：________________________________</div>\n</div></div>"}]}, "politics": {"chapters": [{"name": "1. 刷题策略", "num": 1, "html": "<div class=\"card\" style=\"border:2px solid var(--c4)\"><h2 style=\"color:var(--c4)\">刷题策略 · 720题 + 24h三刷法</h2>\n<h3>为什么选720题不选1000题</h3>\n<div class=\"hl imp\">1000题偏离真题风格，固步自封。720题更贴近真题思路。</div>\n<h3>刷题方式</h3>\n<div class=\"hl\">统一<b>线上刷题</b>（非纸质版），有错题记录+口诀辅助记忆。每天约半小时，听课的同学可穿插进行。</div>\n<h3>进阶路径</h3>\n<div class=\"flow\" style=\"margin:8px 0\"><span class=\"flow-step\" style=\"background:rgba(142,68,173,.1);border-color:var(--c4)\">720题</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\" style=\"background:rgba(142,68,173,.1);border-color:var(--c4)\">真题选择题</span><span class=\"flow-arrow\">&rarr;</span><span class=\"flow-step\" style=\"background:rgba(142,68,173,.15);border-color:var(--c4);font-weight:700\">各大老师模拟卷</span></div>\n<div class=\"hl imp\">12月初之前，选择题错得越多越好——暴露盲区才能学到更多。</div>\n<h3>24小时三刷法（核心节奏）</h3>\n<table><tr><th>时段</th><th>操作</th></tr>\n<tr><td style=\"font-weight:700\">下午第一件事（~13:00）</td><td>刷30道（1分钟1题），看完解析即可，<b>不做笔记</b>，混眼熟</td></tr>\n<tr><td style=\"font-weight:700\">晚上回宿舍路上</td><td>把当天错题重做一遍</td></tr>\n<tr><td style=\"font-weight:700\">第二天早上上学路上</td><td>再把昨天错题刷一遍</td></tr>\n</table>\n<div class=\"hl\">逻辑和背单词一样——高频接触，做多自然熟。</div>\n</div>\n"}, {"name": "2. 计划与任务", "num": 2, "html": "<div class=\"card\"><h2>月度备考计划</h2>\n<div class=\"month-card\"><h4>1月</h4><label><input type=\"checkbox\" data-id=\"pol_month_0\"><span style=\"font-size:.8rem\">（未开始）</span></label></div>\n<div class=\"month-card\"><h4>2月</h4><label><input type=\"checkbox\" data-id=\"pol_month_1\"><span style=\"font-size:.8rem\">（未开始）</span></label></div>\n<div class=\"month-card\"><h4>3月</h4><label><input type=\"checkbox\" data-id=\"pol_month_2\"><span style=\"font-size:.8rem\">（未开始）</span></label></div>\n<div class=\"month-card\"><h4>4月</h4><label><input type=\"checkbox\" data-id=\"pol_month_3\"><span style=\"font-size:.8rem\">（未开始）</span></label></div>\n<div class=\"month-card\"><h4>5月</h4><label><input type=\"checkbox\" data-id=\"pol_month_4\"><span style=\"font-size:.8rem\">（未开始）</span></label></div>\n<div class=\"month-card\"><h4>6月</h4><label><input type=\"checkbox\" data-id=\"pol_month_5\"><span style=\"font-size:.8rem\">（未开始）</span></label></div>\n<div class=\"month-card\"><h4>7月</h4><label><input type=\"checkbox\" data-id=\"pol_month_6\"><span s heckbox\"> 看视频课 / 技巧课（章节：__________）</div>\n<div style=\"font-weight:600;margin-top:8px\">错题记录（为什么错）</div><div class=\"template-box\"></div>\n<div style=\"margin-top:8px\">明日重点：________________________________</div>\n</div></div>"}]}, "tips": {"chapters": [{"name": "1. 通用方法论", "num": 1, "html": "<div class=\"card\"><h2>笔记三件套（强化阶段必做）</h2>\n<ul class=\"clist\">\n<li><b>三套并行：</b>计算题解题方法 / 记忆型知识点 / 冷门知识点</li>\n<li><b>最高效原则：</b>只写知识点名称（如 DRAM、SRAM），<b>不写具体内容</b>。复习时自己想，想不起来再翻书——这本身就是一次复习</li>\n<li>电子/纸质均可，真题阶段不再翻书，查知识点很方便</li>\n</ul></div>\n<div class=\"card\"><h2>错题复盘（两类，方法完全不同）</h2>\n<ul class=\"clist\">\n<li><b>思路型错题：</b>当时为什么没想到？思路卡在哪？→ 题目下面自己写一遍思路与正确解法 → 底部提炼「<b>信号—反射</b>」（看到某条件→立刻想到怎么操作）→ 定期回顾</li>\n<li><b>计算型错题：</b>写下为什么错、易错点在哪 → 定期重算</li>\n<li><b>高效版：</b>题目截屏＋答案截屏＋只写知识点和错因，半小时搞定</li>\n</ul></div>\n<div class=\"card\"><h2>脑力型努力 &gt; 体力型努力</h2>\n<ul class=\"clist\">\n<li>做每题时，把完整思考路径记在脑子里；做完立刻看答案<b>双视角复盘</b>：错→哪步出问题/哪步没想到/原因；对→能否优化思考路径</li>\n<li>节奏参考：<b>10-14 天一本书</b>，后期<b>一天两套卷</b></li>\n</ul></div>\n<div class=\"card\"><h2>笔记原则 · AI 辅助 · 自测 · 心态</h2>\n<ul class=\"clist\">\n<li>笔记不抄讲义、错题不抄题目；学完一章拿张大纸总结：知识点＋常见题型＋常见方法；也可录讲解视频给自己看</li>\n<li>难懂概念用 AI（豆包/kimi/ds 免费版）理解「<b>为什么这样设计</b>」，注意甄别 AI 错误</li>\n<li><b>费曼自测：</b>假装给别人讲一遍，哪里卡了就是哪里不会，讲顺了就是都会了</li>\n<li><b>心态：</b>不因晚起半小时焦虑一整天，不因别人刷几遍乱节奏，把考研当长跑</li>\n</ul></div>"}, {"name": "2. 数据结构", "num": 2, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li>算法细节多、容易混 → 对照教材把细节补上，高频易错点整理进笔记；<b>不要大段抄教材原文</b></li>\n<li>深度标准：要比常考点更深一层，理解<b>底层运行机制</b>。例：简单选择排序不稳定，因为插入是「与后一位置交换」而非整体后移——408 要掌握到这个程度</li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>算法与代码实现脱节 → 学了理论写不出代码，综合大题直接抓瞎</li>\n<li>刷题只对答案不复盘 → 同样算法题错又错，没有补洞</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li>笔记整理<b>高频算法易错点</b>（只写名称，不写内容）</li>\n<li>算法题用费曼学习法自测：能不能把思路完整讲出来</li>\n<li>错题按思路型/计算型分类复盘</li>\n</ul></div>"}, {"name": "3. 计算机组成原理", "num": 3, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li>别从头到尾死记硬背，把概念放进<b>具体场景</b>里理解；核心规则一个一个套，做一遍比干背定义记得深</li>\n<li>知识深度要求高——经常要理解到<b>硬件层面是怎么运行的</b></li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>抓冷门、零分值细节，核心内容草草带过</li>\n<li>计组/OS/计网之间不对比联动 → 综合大题抓瞎</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li>理解优先：用 AI 理解「为什么这样设计」（如中断 vs 系统调用硬件做的事为什么不同，选择题会考）</li>\n<li>硬件题放进场景套规则，不要干背</li>\n<li>与 OS 的联动（存储管理、I/O）主动画关联图</li>\n</ul></div>"}, {"name": "4. 操作系统", "num": 4, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li>概念理解优先，大量概念靠理解记忆，不能死背定义</li>\n<li>理解「为什么这样设计」比背定义更好记忆</li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>听课流于过场，四门课各自讲了什么、什么关系根本没串起来</li>\n<li>完全依赖老师和现成资料、自己不整理笔记 → 做题时想不起来在哪</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li>用 AI 理解设计原因（进程调度策略、虚拟内存机制为什么这样设计）</li>\n<li>笔记只写知识点名称（页面置换算法、银行家算法），不写内容，自己回想</li>\n<li>与计组的联动（存储层次、I/O 控制）主动对比</li>\n</ul></div>"}, {"name": "5. 计算机网络", "num": 5, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li>协议为什么这样设计<b>是有原因的</b>——理解设计动机比背协议格式好记忆</li>\n<li>大量协议细节适合整理进<b>记忆型知识点笔记</b></li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>全凭死背 → 选择题一换角度出题就懵</li>\n<li>四门分开复习 → 与 OS/计组不关联，综合题抓瞎</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li>笔记只写协议/概念名称，复习时想细节，想不起来翻书</li>\n<li>用 AI 理解协议设计动机</li>\n<li>关联图重点标出：数据链路层与硬件、传输层与 OS 的关联</li>\n</ul></div>"}, {"name": "6. 高等数学", "num": 6, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li><b>基础：</b>张宇基础 30 讲（讲义＋视频）过一遍，从头建立框架；配套一本综合习题集＋一本选填题册；看完一章做对应章节</li>\n<li>判断基线：正确率七八成＝路子走得通；六成以下＝基础不牢，换更基础的练习册</li>\n<li><b>滚动复习法：</b>学到微积分后半段 → 加选填题册，一边学新课一边从头刷选填</li>\n<li><b>强化：</b>核心两字——刷题，拼命刷两本习题集；强化课重点是提炼做题技巧；某章集中出错 → 找对应强化视频/专题，不用从头看</li>\n<li><b>冲刺：</b>模拟卷为主，每天一套＋订正错题；每天数学 3 小时左右足够</li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>重积分/微分方程/多元微积分又臭又长；重点题做不动就跳 → 真题遇到复杂二重积分就不会做</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li><b>难章节救命法：</b>重积分/微方程/多元微积分大题必考计算能力 → 每天早上刷一道重点题</li>\n<li><b>题型套路整理：</b>每种题型列对应解法＋经典例题，反复练到锁住思路，遇到不会的随时拿出来看</li>\n<li>1000 题 vs 880：题量多的选 1000，嫌多就 880；身边 120+ 大神都做了 50 套模拟卷</li>\n</ul></div>"}, {"name": "7. 线性代数", "num": 7, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li>线代是<b>一个整体体系</b>，不是碎片化知识点——第一遍学完一团浆糊＝正常</li>\n<li>基础学完<b>不要急着往下推</b>：先回头把基础内容捋一遍，再看强化视频；强化完才慢慢摸到门路</li>\n<li>强化过程中基础要反复看、反复练，不然容易回到原点</li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>学完就忘——不与高数/概率论同步推进容易丢一边</li>\n<li>强化没通整条脉络 → 做题还是一塌糊涂</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li><b>主修一门＋辅修一门</b>同步推进防遗忘（线代、概率尤其要和高等同步）</li>\n<li>线代直接吃透讲义＋880，然后直接做模拟卷/真题里的线代题，<b>不必再加别的练习册</b></li>\n<li>强化后发现没体系 → 赶紧回去重新捋基础；强化阶段两本习题集线代部分大量刷</li>\n</ul></div>"}, {"name": "8. 概率论与数理统计", "num": 8, "html": "<div class=\"card\"><h2>经验</h2>\n<ul class=\"clist\">\n<li>核心是<b>定义理解得足够深</b>，不是记几个技巧套路就够</li>\n<li>基础：教材过一遍，每节例题<b>遮住答案自己推一遍</b>；推不出回头看定义，反复到能顺畅写出；再做习题集基础题</li>\n<li>880 线代做完且正确率高 → 可减少数学时间，给其他科腾时间</li>\n</ul></div>\n<div class=\"card\"><h2>教训</h2>\n<ul class=\"clist\">\n<li>靠技巧套路 → 题型一变就懵；不与高数/线代同步推进容易丢</li>\n</ul></div>\n<div class=\"card\"><h2>具体做法</h2>\n<ul class=\"clist\">\n<li><b>错题三类归档：</b>概念理解错 / 计算粗心 / 公式记混，每类单独记本子，隔两三天默写一遍/重推一遍</li>\n<li><b>数理统计：</b>矩估计、最大似然估计写成<b>固定流程模板</b>，严格按模板走，重复十几道才有感觉</li>\n<li>基础三板斧：反复读定义、反复做例题、反复整理错题，慢但扎实</li>\n<li>强化：看课＋综合习题集强化部分＋另一本习题集＋强化教材题目，猛练</li>\n</ul></div>"}, {"name": "10. 408 全程规划", "num": 10, "html": "<div class=\"card\"><h2>个人复习时间线（作者原话 · 参考）</h2>\n<table><tr><th>时间段</th><th>主要任务</th><th>备注</th></tr>\n<tr><td><b>3 月</b></td><td>开始复习，先看数据结构＋计算机网络</td><td>上学期学过计网，复习点热乎，约一个半月结束</td></tr>\n<tr><td><b>4 月中-5 月底</b></td><td>计组＋操作系统</td><td>两门联系密切，交叉学起来较顺畅</td></tr>\n<tr><td><b>6 月</b></td><td>期末考试＋摆</td><td>408 几乎没复习</td></tr>\n<tr><td><b>7-8 月</b></td><td>强化阶段</td><td>6 月中断出现艾宾浩斯遗忘，重新过一遍书＋写完王道课后大题</td></tr>\n<tr><td><b>9 月</b></td><td>做 408 真题</td><td>三天两张 → 一天一张，整理错题本，记录理解不到位的地方</td></tr>\n<tr><td><b>10 月中</b></td><td>看袁书第 2-6 章</td><td>知识面扩展，做 relax1000 题（OS 部分尤其精彩）</td></tr>\n<tr><td><b>11-12 月</b></td><td>政英冲刺挤压 408 时间</td><td>只回顾错题本，每天二刷一套真题（避免灾难性遗忘）</td></tr></table>\n<div class=\"hl imp\">⚠️ 时间线教训：6 月摆烂导致 7-8 月要重过一遍书——基础阶段尽量别完全中断，保持每日接触哪怕少量。</div>\n</div>\n<div class=\"card\"><h2>比较理想的全程规划</h2>\n<h3>基础阶段（3-6 月）</h3>\n<ul class=\"clist\">\n<li>任务：对 408 全面了解，重点掌握王道书＋课后选择题</li>\n<li>流程：书 → 课 → 课后题</li>\n<li>核心策略：<b>两门课交叉学习</b>（减少灾难性遗忘）——计组↔OS（关系密切，强烈建议交叉）；数据结构↔计网</li>\n<li>补充：OS 可参考考察课程（深度独树一帜，对提升理解很有帮助）</li>\n</ul>\n<h3>强化阶段（7-8 月）</h3>\n<ul class=\"clist\">\n<li>任务：掌握 408 大题；<b>真题大题是重点和主线</b>，结合王道强化课</li>\n<li>PV 大题可看夺鸾；有余力计组大题可看袁书</li>\n<li>刚开始做吃力正常，做多了会发现题型和考法相对固定</li>\n<li>王道课后大题质量参差不齐，<b>只建议写数据结构的大题</b></li>\n</ul>\n<h3>冲刺阶段（9-12 月）</h3>\n<ul class=\"clist\">\n<li>9 月起做真题：认真记录错题、理解不足之处，适当深挖</li>\n<li>学有余力／王道讲不清 → 看袁书、汤书深化理解</li>\n<li>真题<b>至少刷两遍</b>；一遍后隔天练一份（保持手感＋避免遗忘）</li>\n<li>12 月政英挤压 → 保温为主（错题本＋二刷真题），避免灾难性遗忘</li>\n<li>强化、冲刺阶段整理自己的笔记很重要 → 后期快速回忆、节省时间</li>\n</ul>\n</div>\n<div class=\"card\"><h2>心得建议（7 条）</h2>\n<ul class=\"clist\">\n<li><b>1. 基础阶段用王道书没问题</b>——除非基础好的科班，否则基础过一遍王道书没有任何问题</li>\n<li><b>2. 408 重理解轻记忆</b>——真题考灵活掌握；目标 120 仅靠王道书够，120+ 需补充材料</li>\n<li><b>3. 袁书非常重要</b>——补充材料里 top1，今年计组大题与袁书风格高度相似，读完重难点章节</li>\n<li><b>4. 两本书交叉学习</b>——减少「学到后面忘掉前面」的灾难性遗忘（计组↔OS、DS↔计网）</li>\n<li><b>5. 算法题不要怕，暴力解性价比最高</b>——408 考思路而非代码严谨性，暴力算法拿大部分分；追求 130+、140+ 再深入</li>\n<li><b>6. 真题是质量最高的资料</b>——冷门考点反复考（如以太网中继器延迟连续两年），务必全面彻底掌握</li>\n<li><b>7. 核心：全面反复＋深化理解</b>——三轮足够，太少则反复更重要，不断强化对体系的理解</li>\n</ul></div>\n<div class=\"card\"><h2>可执行总结（时间线 · 资料组合）</h2>\n<table><tr><th>阶段</th><th>月份</th><th>主线</th></tr>\n<tr><td><b>基础</b></td><td>3-6 月</td><td>王道书＋课后选择题，两门交叉（计组↔OS、DS↔CN）</td></tr>\n<tr><td><b>强化</b></td><td>7-8 月</td><td>王道强化课＋真题大题（数据结构课后大题）＋袁书/汤书补充</td></tr>\n<tr><td><b>冲刺</b></td><td>9-12 月</td><td>真题刷两遍＋错题本＋12 月保温（二刷真题）</td></tr></table>\n<ul class=\"clist\">\n<li><b>资料组合：</b>目标 120 → 王道书＋王道强化课，够；目标 120+ → 王道＋袁书（计组必看）＋汤书（OS 选看）＋湖科大 MOOC（计组计网）</li>\n<li><b>算法题：</b>暴力解拿大部分分，先把暴力写出来；算法大佬才追求最优解（130+ 选手）</li>\n<li><b>真题：</b>9 月三天两张 → 一天一张；一遍后隔天一份保持手感；冷门考点反复考，每个点都要掌握</li>\n<li><b>遗忘：</b>6 月完全中断的代价＝7-8 月重新过书；基础两门交叉减少遗忘；强化冲刺整理笔记是保温关键</li>\n<li><b>袁书：</b>补充材料 top1，计组大题风格相似，至少读完重难点章节</li>\n</ul></div>"}]}, "sprint": {"chapters": [], "html": "<div class=\"stats\"><div class=\"stat-card\"><div class=\"stat-num\" style=\"color:var(--c4)\">3h</div><div class=\"stat-label\">政治日均</div></div><div class=\"stat-card\"><div class=\"stat-num\" style=\"color:var(--c2)\">1套/天</div><div class=\"stat-label\">数学模拟卷</div></div><div class=\"stat-card\"><div class=\"stat-num\" style=\"color:var(--c3)\">2022-2026</div><div class=\"stat-label\">英语真题模考</div></div><div class=\"stat-card\"><div class=\"stat-num\" style=\"color:var(--c1)\">近3年</div><div class=\"stat-label\">408真题吃透</div></div></div>\n<div class=\"card\"><h2>12月冲刺总览</h2><table><tr><th>科目</th><th>核心任务</th><th>每日要求</th></tr>\n<tr><td><span class=\"tag t4\">政治</span></td><td>肖四大题全背+陆寓丰答题模板</td><td>日均3h</td></tr>\n<tr><td><span class=\"tag t2\">数学</span></td><td>一天一套模拟卷+8:30模考</td><td>3h限时</td></tr>\n<tr><td><span class=\"tag t3\">英语</span></td><td>2022-2026真题模考+AI批改</td><td>自批+AI</td></tr>\n<tr><td><span class=\"tag t1\">408</span></td><td>近三年真题吃透+错题再做+回归书本</td><td>答题卡模考</td></tr>\n</table></div>\n<div class=\"card\"><h2>🎯 考前状态与心态</h2><ul class=\"clist\">\n<li><label><input type=\"checkbox\" data-id=\"final_st_sleep\"> 调整作息：按考试时间对齐生物钟</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_st_err\"> 回顾错题本</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_st_items\"> 准备考试用品</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_st_mind\"> 保持心态平稳</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_st_nonew\"> 不要再做新题</label></li>\n</ul><div class=\"hl imp\">最后阶段的核心：<b>不做新题、不追进度</b>，把作息、状态与心态调到最好。</div></div>\n<div class=\"card\"><h2>考前最终检查清单</h2><ul class=\"clist\">\n<li><label><input type=\"checkbox\" data-id=\"final_408_book\"> 408四本书重新翻看</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_408_err\"> 408二刷一轮错题</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_408_mock\"> 408近三年全真模拟</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_math_mock\"> 数学一天一套模拟卷</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_math_text\"> 数学教材例题看完</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_eng_22\"> 英语2022-2026真题完成</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_eng_write\"> 英语作文模板背诵+AI批改</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_pol_x4\"> 肖四大题全背</label></li>\n<li><label><input type=\"checkbox\" data-id=\"final_pol_lu\"> 陆寓丰答题模板</label></li>\n</ul><div class=\"pb\"><div class=\"pf\" id=\"sprintProgress\" style=\"width:0%;background:#e6c300\"></div></div></div>"}};
var BK_MOVED={plan:[],exam:[],mistakes:[]};
var mvIdx={plan:0,exam:0,mistakes:0};
function bkPrep(){
  var all=BK_SECTIONS;
  function mv(group,names,cat){
    var g=all[group]; if(!g||!g.chapters) return;
    g.chapters=g.chapters.filter(function(ch){
      for(var i=0;i<names.length;i++){ if(ch.name.indexOf(names[i])>=0){ BK_MOVED[cat].push({group:group,name:ch.name,html:ch.html}); return false; } }
      return true;
    });
  }
  function del(group,names){
    var g=all[group]; if(!g||!g.chapters) return;
    g.chapters=g.chapters.filter(function(ch){
      for(var i=0;i<names.length;i++){ if(ch.name.indexOf(names[i])>=0) return false; }
      return true;
    });
  }
  Object.keys(all).forEach(function(gid){
    var g=all[gid];
    if(g&&g.chapters) g.chapters=g.chapters.filter(function(ch){ return ch.name.indexOf("每日任务卡")<0; });
  });
  mv("s408",["阶段规划"],"plan");
  mv("math",["规划体系"],"plan");
  mv("english",["计划与进度"],"plan");
  mv("politics",["计划与任务"],"plan");
  del("s408",["月度计划"]);
  del("math",["月度计划"]);
  mv("s408",["真题与模拟"],"exam");
  mv("math",["真题与模拟"],"exam");
  mv("english",["真题与题型"],"exam");
  mv("politics",["模拟卷"],"exam");
  mv("math",["错题方法论"],"mistakes");
  var tips=all["tips"];
  if(tips&&tips.chapters){
    tips.chapters.forEach(function(ch){
      if(ch.name.indexOf("通用方法论")>=0){
        var re=/<div class="card"><h2>错题复盘[\s\S]*?<\/ul>\s*<\/div>/;
        var mm=ch.html.match(re);
        if(mm){ BK_MOVED.mistakes.push({group:"tips",name:"错题复盘",html:mm[0]}); ch.html=ch.html.replace(re,""); }
      }
    });
  }
  // 高分经验：科目类章节同步到对应科目组
  var tips2=all["tips"];
  if(tips2&&tips2.chapters){
    var tipMove=[
      {names:["数据结构","计算机组成原理","操作系统","计算机网络"], group:"s408"},
      {names:["高等数学","线性代数","概率论与数理统计"], group:"math"}
    ];
    tips2.chapters.forEach(function(ch){
      for(var ti=0; ti<tipMove.length; ti++){
        var tm=tipMove[ti]; var matched=false;
        for(var ni=0; ni<tm.names.length; ni++){
          if(ch.name.indexOf(tm.names[ni])>=0){ matched=true; break; }
        }
